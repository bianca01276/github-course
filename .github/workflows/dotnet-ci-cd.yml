name: .NET CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ github.workspace }}/GithubCourse.slnx

      - name: Build
        run: dotnet build ${{ github.workspace }}/GithubCourse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ github.workspace }}/tests/SimpleApp.Tests/SimpleApp.Tests.csproj --configuration Release --no-build --verbosity normal

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish ${{ github.workspace }}/src/SimpleApp/SimpleApp.csproj --configuration Release --output ${{ github.workspace }}/publish

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: simpleapp
          path: ${{ github.workspace }}/publish
